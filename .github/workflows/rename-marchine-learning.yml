name: Rename marchine_learning
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename directory
        run: git mv marchine_learning machine_learning
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rename-marchine-learning.yml
          git add -A
          git commit -m "Rename marchine_learning to machine_learning"
          git push origin HEAD:main
