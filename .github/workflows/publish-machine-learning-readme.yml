name: Publish machine_learning README
on: [push]
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish README with bot identity
        env:
          README_B64: |
            
            
            
        run: |
          set -euo pipefail
          if [ -e machine_learning/README.md ]; then
            echo "machine_learning/README.md already exists"
            exit 1
          fi
          printf '%s' "$README_B64" | tr -d '[:space:]' | base64 --decode | bzip2 --decompress > machine_learning/README.md
          test -s machine_learning/README.md
          grep -q "全国大学生数学建模竞赛" machine_learning/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-machine-learning-readme.yml
          git add machine_learning/README.md
          git commit -m "Add machine_learning directory guide"
          git push origin HEAD:main
